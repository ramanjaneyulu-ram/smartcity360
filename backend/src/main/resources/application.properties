spring.application.name=smartcity360

# ---- MySQL ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=${PORT:8080}
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Email notifications (Resend HTTPS API) ----
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.from=${RESEND_FROM:}

# ---- JWT ----
# 256-bit+ secret used to sign tokens. Change this in production and load from an env var instead.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
